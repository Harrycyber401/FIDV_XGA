<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FIDV — Industry gate</title>
<link rel="stylesheet" href="/css/app.css?v=35" />
</head>
<body class="home-body">
  <!-- [C-SPLASH] On C-HOME only; hold ~2s then fade ~4s -->
  <div id="splash" class="splash" aria-hidden="true">
    <div class="splash-mark">
      <svg class="splash-logo" viewBox="0 0 280 72" width="220" height="56" aria-hidden="true">
        <g fill="none" stroke="#17202b" stroke-width="1.25" stroke-linejoin="round">
          <rect x="8" y="14" width="18" height="44" rx="1.5" opacity="0.95"/>
          <rect x="22" y="14" width="18" height="44" rx="1.5" opacity="0.55"/>
          <rect x="36" y="14" width="18" height="44" rx="1.5" opacity="0.28"/>
        </g>
        <text
          x="72" y="48"
          fill="#17202b"
          font-family="Iowan Old Style, Palatino Linotype, Palatino, Georgia, serif"
          font-size="34"
          letter-spacing="0.22em"
        >FIDV</text>
        <line x1="72" y1="56" x2="248" y2="56" stroke="#0d9d6b" stroke-width="1" opacity="0.55"/>
      </svg>
    </div>
  </div>

  <nav class="home-trail-fixed" id="homeTrail" aria-label="Coordinate path"></nav>

  <main class="home home-pending" id="home" hidden>
    <header class="home-brand">
      <a href="/" class="home-logo-link" aria-label="FIDV industry gate">
      <svg class="splash-logo home-logo" viewBox="0 0 280 72" width="200" height="52" aria-hidden="true">
        <g fill="none" stroke="#17202b" stroke-width="1.25" stroke-linejoin="round">
          <rect x="8" y="14" width="18" height="44" rx="1.5" opacity="0.95"/>
          <rect x="22" y="14" width="18" height="44" rx="1.5" opacity="0.55"/>
          <rect x="36" y="14" width="18" height="44" rx="1.5" opacity="0.28"/>
        </g>
        <text
          x="72" y="48"
          fill="#17202b"
          font-family="Iowan Old Style, Palatino Linotype, Palatino, Georgia, serif"
          font-size="34"
          letter-spacing="0.22em"
        >FIDV</text>
        <line x1="72" y1="56" x2="248" y2="56" stroke="#0d9d6b" stroke-width="1" opacity="0.55"/>
      </svg>
      </a>
      <p class="home-lede" id="homeLede">BICS industry coordinates · a level-4 cell opens the company list.</p>
      <a class="home-cube" id="homeCubeLink" href="/cube">Decision cube</a>
    </header>

    <nav class="home-nations" id="nationList" aria-label="Listing country"></nav>
    <p class="home-total" id="homeTotal"></p>

    <nav class="home-sectors" id="sectorList" aria-label="BICS industry coordinates"></nav>

    <p class="home-note">Class-3 industry coordinates · Equity Hierarchy 2024 · L1–L3 board · L4 → company list</p>
  </main>
  <script type="module" src="/js/home.js?v=35"></script>
</body>
</html>
